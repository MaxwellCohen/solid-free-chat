name: Flag merge conflicts
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'merge-conflict'
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
            })
            for (const { number } of prs) {
              // mergeable is computed lazily; retry until it is not null.
              let pr
              for (let i = 0; i < 6; i++) {
                pr = (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data
                if (pr.mergeable !== null) break
                await new Promise((r) => setTimeout(r, 5000))
              }
              const has = pr.labels.some((l) => l.name === label)
              if (pr.mergeable === false && !has) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: [label] })
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: number,
                  body: 'This PR has merge conflicts with `main`. Merge or rebase `main` into it.',
                })
              } else if (pr.mergeable === true && has) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: label })
              }
            }
